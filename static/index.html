<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="jm-mode" content="local">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/icon.png">
<title>__APP_NAME__</title>
<link rel="icon" href="/icon.png">
<style>
/* ------------------------------------------------------------------
   One number on a white page. Two colours, one typeface, one text size
   (plus the number itself). Nothing else is shown until you ask.

   The rules of the interface:
     - anything that turns black under the pointer can be clicked
     - every number opens into the numbers it's made of
     - every date takes the whole page to that day
------------------------------------------------------------------- */
:root { --bg: #fff; --fg: #000; }
html.inv { --bg: #000; --fg: #fff; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 13px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; border-radius: 0; }
button { cursor: pointer; }

#stage { width: min(680px, calc(100% - 48px)); margin: 0 auto; padding: 38vh 0 150px; transition: padding-top .45s cubic-bezier(.2, .7, .2, 1); }
#stage.opened { padding-top: 92px; }

/* rows */
.row { display: flex; align-items: baseline; gap: 14px; padding: 5px 8px 5px calc(8px + var(--d) * 22px); margin: 0 -8px; cursor: pointer; outline: 0; user-select: none; -webkit-user-select: none; }
.row:focus-visible { background: var(--fg); color: var(--bg); }
@media (hover: hover) { .row:hover { background: var(--fg); color: var(--bg); } .row:hover .sp { opacity: 1; } .row.root:hover { background: none; color: inherit; }
  .w:hover, #sugg div.c:hover { background: var(--fg); color: var(--bg); } }
.name { text-transform: lowercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fill { flex: 1; }
.sp { flex: none; align-self: center; padding: 4px 6px; margin: -4px -6px; opacity: 0; line-height: 0; }
.sp svg { width: 72px; height: 14px; display: block; overflow: visible; }
.row:focus-visible .sp { opacity: 1; }
.val { white-space: nowrap; }
.val s { text-decoration-thickness: 1px; }

/* the number */
.row.root { font-size: clamp(56px, 11vw, 148px); line-height: 1; letter-spacing: -.045em; padding: 0; margin: 0 0 22px; align-items: flex-start; gap: 0; }
.row.root:focus-visible { background: none; color: inherit; }
.row.root:focus-visible .val { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .09em; }
.row.root .val s { font-size: 13px; line-height: 1.5; letter-spacing: 0; vertical-align: top; margin: .5em 0 0 12px; display: inline-block; }
.row.root .unit { font-size: 13px; line-height: 1.5; letter-spacing: 0; margin: .5em 6px 0 -4px; }
.row.root .sp { align-self: flex-end; margin: 0 0 .12em 18px; padding: 6px; }
.row.root .sp svg { width: 120px; height: 36px; }

/* words you can click */
.w { padding: 1px 4px; margin: 0 -4px; outline: 0; white-space: nowrap; }
.w:focus-visible, .w:active { background: var(--fg); color: var(--bg); }
.w.on, .w.d { text-decoration: underline; text-underline-offset: 3px; }
.words { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 10px 0; }

/* what opens under a row */
.kids.in, .story.in, .form.in { animation: in .24s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(-6px); } }
.story { padding: 12px 0 20px calc(var(--d) * 22px); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 120px; overflow: visible; cursor: crosshair; }
.chart text { font: 13px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: var(--fg); }
.facts { margin: 12px 0; max-width: 62ch; }

/* forms: lines to write on */
.form { padding: 14px 0 6px; }
.form .line { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; margin-bottom: 8px; }
.form input, .form select { border-bottom: 1px solid var(--fg); padding: 3px 0; min-width: 0; outline: 0; flex: 1 1 120px; -webkit-appearance: none; appearance: none; }
.form input[type=file] { border: 0; flex: 2 1 220px; }
.form input::placeholder, #q::placeholder { color: var(--fg); opacity: 1; }
.form input:focus::placeholder { opacity: 0; }
.form input:focus-visible, .form select:focus-visible { border-bottom-width: 2px; padding-bottom: 2px; }
.form select option { color: #000; background: #fff; }

/* fixed furniture: status (only when there's something to say), the prompt, and the line of time */
#status { position: fixed; top: 18px; left: 24px; right: 24px; pointer-events: none; z-index: 3; }
#status > div { pointer-events: auto; display: inline-block; background: var(--bg); padding-right: 6px; }
#status .l { display: block; }
#cmd { position: fixed; left: 24px; bottom: 36px; width: min(560px, calc(100% - 48px)); z-index: 4; }
#q { width: 3ch; outline: 0; caret-color: var(--fg); background: var(--bg); cursor: pointer; }
#cmd.open #q { width: 100%; cursor: text; }
#sugg { padding: 10px 0 14px; max-height: calc(100vh - 110px); overflow: auto; display: none; }
#cmd.open::before { content: ""; position: fixed; inset: 0; background: var(--bg); z-index: -1; }   /* the prompt gets the whole page while it's open */
#cmd.open #sugg { display: block; }
#sugg div { display: flex; gap: 20px; padding: 2px 6px; margin: 0 -6px; }
#sugg div span:first-child { flex: 0 0 26ch; }
#sugg div.c { cursor: pointer; }
#sugg div.c span:first-child { flex: 1; }
#sugg div.sel, #sugg div.c:active { background: var(--fg); color: var(--bg); }
#sugg div.gap { height: 10px; }
#time { position: fixed; left: 0; right: 0; bottom: 0; height: 26px; cursor: ew-resize; z-index: 2; touch-action: none; }
#time::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid var(--fg); }
#tick { position: absolute; bottom: 0; width: 1px; height: 12px; background: var(--fg); }
#tdate { position: absolute; bottom: 14px; white-space: nowrap; background: var(--bg); padding: 0 4px; display: none; }

#qx { display: none; }
.qr { display: block; width: 196px; height: 196px; margin: 0 0 18px -16px; }
html.inv .qr { margin-left: 0; }
.sel-ok { user-select: text; -webkit-user-select: text; word-break: break-all; }

/* ------------------------------------------------------------------
   Phone. Same rules, rebuilt for a thumb. One number fills the width.
   Tapping a row makes it the number; the rows above it lead back out.
------------------------------------------------------------------- */
html.m body { font-size: 16px; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
html.m #status { position: sticky; top: 0; left: auto; right: auto; padding: calc(env(safe-area-inset-top) + 10px) 20px 0; background: var(--bg); pointer-events: auto; }
html.m #status > div { display: block; padding: 0 0 8px; }
html.m #status .l { padding: 3px 0; }
html.m #stage { width: auto; margin: 0 20px; padding: 30vh 0 190px; padding-top: 30dvh; }
html.m #stage.opened { padding-top: 4px; }
html.m .screen.in { animation: in .22s ease-out; }
html.m .row { min-height: 50px; align-items: center; padding: 0 20px; margin: 0 -20px; gap: 12px; touch-action: pan-y; -webkit-touch-callout: none; }
html.m .row:active { background: var(--fg); color: var(--bg); }
html.m .head { display: flex; align-items: center; min-height: 50px; text-transform: lowercase; }
html.m .spb { padding: 15px 0 15px 24px; line-height: 0; }
html.m .spb svg { width: 96px; height: 20px; display: block; overflow: visible; }
html.m .row.root { padding: 0; margin: 0 0 18px; min-height: 0; align-items: flex-start; letter-spacing: -.045em; line-height: 1; }
html.m .row.root:active { background: none; color: inherit; }
html.m .row.root .unit { font-size: 16px; margin: 0 2px 0 -8px; padding: 6px 8px 14px; }
html.m .row.root .val { white-space: normal; }
html.m .row.root .val s { display: block; font-size: 16px; margin: 10px 0 0; }
html.m .story { padding: 4px 0 22px; }
html.m .chart svg { height: 150px; touch-action: pan-y; }
html.m .chart text { font-size: 16px; }
html.m .w { padding: 11px 6px; margin: -11px -6px; }
html.m .words { gap: 22px 28px; margin: 22px 0; }
html.m .facts div { padding: 4px 0; }
html.m .form .line { flex-direction: column; align-items: stretch; gap: 16px; margin-bottom: 16px; }
html.m .form input, html.m .form select { flex: none; min-height: 44px; font-size: 16px; }
html.m #cmd { left: 12px; right: 12px; width: auto; bottom: calc(env(safe-area-inset-bottom) + 50px); }
html.m #q { width: 44px; height: 44px; padding: 0 8px; font-size: 16px; }
html.m #cmd.open { inset: 0; padding: calc(env(safe-area-inset-top) + 8px) 0 0; display: flex; flex-direction: column; overflow: hidden; }
html.m #cmd.open #q { order: 0; flex: none; width: calc(100% - 110px); margin: 0 20px; padding: 0; border-bottom: 1px solid var(--fg); }
html.m #cmd.open #sugg { order: 1; flex: 1; min-width: 0; max-height: none; padding: 18px 0 55vh; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }   /* up and down only */
html.m #cmd.open #qx { display: block; position: absolute; right: 20px; top: calc(env(safe-area-inset-top) + 8px); height: 44px; }
html.m #sugg div { display: block; padding: 0 20px; margin: 0 0 14px; overflow-wrap: anywhere; }
html.m #sugg div span { display: block; flex: none; }
html.m, html.m body { overflow-x: hidden; overflow-x: clip; overscroll-behavior-x: none; }
html.m #sugg div.c { display: flex; align-items: center; min-height: 48px; margin-bottom: 0; }
html.m #sugg div.gap { height: 6px; }
html.m #time { height: 44px; bottom: env(safe-area-inset-bottom); }
html.m body::after { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: calc(env(safe-area-inset-bottom) + 100px); background: var(--bg); z-index: 1; }
html.m .w:focus-visible { background: none; color: inherit; }
html.m .w:active { background: var(--fg); color: var(--bg); }
html.m .head, html.m .facts { -webkit-user-select: none; user-select: none; }
html.m #tdate { bottom: 18px; }
@media (max-width: 560px) { #stage { width: calc(100% - 32px); } .row { padding-left: calc(8px + var(--d) * 14px); } .story { padding-left: calc(var(--d) * 14px); } #sugg div span:first-child { flex-basis: 18ch; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body ontouchstart="">
<div id="status" aria-live="polite"></div>
<main id="stage"></main>
<div id="cmd"><div id="sugg"></div><button id="qx" class="w d" type="button">close</button><input id="q" placeholder="_" enterkeyhint="go" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type to find anything or run a command"></div>
<div id="time" title=""><i id="tick"></i><span id="tdate"></span></div>

<script>
const UI_VERSION = "16";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PARAMS = new URLSearchParams(location.search);
const MOBILE = PARAMS.has("m") ? PARAMS.get("m") === "1" : matchMedia("(hover: none) and (pointer: coarse)").matches;
document.documentElement.classList.toggle("m", MOBILE);
// Away from home this same page is published on its own, with the numbers beside it as a locked file.
// The key that opens it is the part of your link after #k=. Browsers never send that part anywhere.
const CLOUD = (document.querySelector('meta[name="jm-mode"]') || {}).content === "cloud";
let bundle = null, shownBuilt = null;
function cloudKey() { const m = /[#&]k=([\w-]+)/.exec(location.hash); try { if (m) localStorage.setItem("jm-k", m[1]); return m ? m[1] : localStorage.getItem("jm-k"); } catch (e) { return m ? m[1] : null; } }
async function unlock(buf, key) {

  const ek = await sub.sign("HMAC", root, te.encode("enc")), mk = await sub.sign("HMAC", root, te.encode("mac"));

  if (!(await sub.verify("HMAC", await sub.importKey("raw", mk, H, false, ["verify"]), tag, body))) throw new Error("key");
  const alg = b[2] === 50 ? { name: "AES-CTR", counter: body.subarray(4, 20), length: 32 } : { name: "AES-CBC", iv: body.subarray(4, 20) };
  const plain = await sub.decrypt(alg, await sub.importKey("raw", ek, alg.name, false, ["decrypt"]), body.subarray(20));

  return JSON.parse(await new Response(out).text());
}
// Two places to read from. "live" is updated by your computer the moment it syncs, and by GitHub every 15 minutes
// when the computer's off. The copy beside this page is the fallback. Whichever is newest wins.
const REPO = ((document.querySelector('meta[name="jm-repo"]') || {}).content || "") || (location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] + "/" + location.pathname.split("/")[1] : "");
async function grab(url, opts, key) { try { const r = await fetch(url, opts); if (!r.ok) return { miss: true }; return { b: await unlock(await r.arrayBuffer(), key) }; } catch (e) { return { bad: e && e.message === "key", miss: true }; } }
async function cloudApi(p, body) {
  if (body !== undefined) return { ok: false, error: "this copy is for looking. change things on your computer" };
  if (p === "/api/state" || !bundle) {
    const key = cloudKey(); if (!key) throw new Error("nokey");
    const live = REPO && typeof DecompressionStream === "function"
      ? grab(`https://api.github.com/repos/${REPO}/contents/data.enc?ref=live`, { cache: "no-cache", headers: { Accept: "application/vnd.github.raw" } }, key) : Promise.resolve({ miss: true });

    const [a, b] = await Promise.all([live, here]);
    const got = [a.b, b.b].filter(Boolean).sort((x, y) => (y.built || "").localeCompare(x.built || ""))[0];
    if (got) { if (a.b === got) got.live = true; if (!bundle || (got.built || "") >= (bundle.built || "")) bundle = got; }
    else if (!bundle) throw new Error(a.bad || b.bad ? "key" : "offline");
  }
  return bundle[p.split("?")[0]];
}
const api = CLOUD ? cloudApi : async (p, body) => (await fetch(p, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json();
const ago = iso => { const m = (Date.now() - new Date(iso).getTime()) / 6e4; return m < 1 ? "just now" : m < 1.5 ? "a minute ago" : m < 90 ? Math.round(m) + " minutes ago" : m < 2880 ? Math.round(m / 60) + " hours ago" : Math.round(m / 1440) + " days ago"; };
const fmt = (n, d = 0) => { const r = Math.abs(n) < (d ? .005 : .5) ? 0 : n; return (r < 0 ? "−" : "") + Math.abs(r).toLocaleString("en-NZ", { minimumFractionDigits: d, maximumFractionDigits: d }); };
const signed = (n, d = 0) => (Math.abs(n) < .5 ? "" : n > 0 ? "+" : "") + fmt(n, d);
const dayOf = iso => new Date(iso.slice(0, 10) + "T00:00:00");
const shortDate = iso => dayOf(iso).toLocaleDateString("en-NZ", { day: "numeric", month: "short", year: "numeric" });
const monthYear = iso => dayOf(iso).toLocaleDateString("en-NZ", { month: "short", year: "numeric" });
const per = { weekly: "week", fortnightly: "fortnight", monthly: "month" };
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const parseNum = s => parseFloat(String(s).replace(/,/g, "").replace(/−/g, "-").replace(/\$/g, ""));

// ---------------------------------------------------------------- state
let S = null, X = null, T = [], N = {};
let open = new Set(), story = new Set(), just = null;
let asOf = null, peek = null;            // pinned day, and the day under the pointer
let lens = 0;                            // 0 dollars, 1 share, 2 change in 30 days, 3 change in a year, 4 gain or loss from prices
let range = 365;                         // how much history the lines show (0 = all)
let F = {};                              // what-if multipliers by account or holding
let showEmpty = false, adding = false, importing = false, editing = null, picking = null, deleting = null;
let note = "", busy = "", charts = [], tHover = false;
let focus = "nw";                        // phone: the number you're looking at
let phonePanel = false, P = null;        // Mac: the "see this on your phone" panel
const LENS = [["$", "dollars"], ["%", "share of what you own"], ["30d", "change in 30 days"], ["1y", "change in a year"], ["±%", "gain or loss from prices"]];

function setInv(on) {
  document.documentElement.classList.toggle("inv", on); store.set("inv", on ? "1" : "");
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = on ? "#000000" : "#ffffff";
  try { window.webkit.messageHandlers.jm.postMessage({ invert: on }); } catch (e) {}
}
setInv(store.get("inv") === "1");

// ---------------------------------------------------------------- the tree
function build() {
  const cname = Object.fromEntries(X.classes.map(c => [c.key, c.name]));
  const live = l => showEmpty || Math.abs(l.value) >= .005 || l.series.some(v => Math.abs(v) >= .005);
  const mk = (id, name, kind, extra) => Object.assign({ id, name, kind, kids: [] }, extra);
  const leafNode = l => { const n = mk(l.key, l.name, "leaf", { leaf: l }); n.kids = l.holdings.filter(h => h.value > .5).map(h => mk(l.key + "/" + h.code, h.name || h.code, "holding", { h })); return n; };
  const big = (a, b) => Math.abs(b.leaf.value) - Math.abs(a.leaf.value);
  const root = mk("nw", "net worth", "root"), own = mk("own", "own", "side"), owe = mk("owe", "owe", "side");
  X.classes.filter(c => c.key !== "debt").forEach(c => {
    const ls = X.leaves.filter(l => l.cls === c.key && live(l));
    if (ls.length) own.kids.push(mk("c:" + c.key, cname[c.key], "cls", { cls: c.key, kids: ls.map(leafNode).sort(big) }));
  });
  owe.kids = X.leaves.filter(l => l.cls === "debt" && live(l)).map(leafNode).sort(big);
  root.kids = owe.kids.length ? [own, owe] : [own];
  N = {};
  (function walk(n, parent, depth, sign) { n.parent = parent; n.depth = depth; n.sign = sign; N[n.id] = n; n.kids.forEach(k => walk(k, n, depth + 1, k.id === "owe" ? -1 : sign)); })(root, null, 0, 1);
}
const last = () => X.dates.length - 1;
const cur = () => peek ?? asOf ?? last();

function leafVal(l, i, wi) {
  const base = l.series[i]; if (!wi) return base;
  const f = F[l.key] ?? 1, hs = l.holdings;
  if (!hs.length || !l.value) return base * f;
  let sum = 0, sumF = 0; hs.forEach(h => { sum += h.value; sumF += h.value * (F[l.key + "/" + h.code] ?? 1); });
  return f * (base / l.value) * (l.value - sum + sumF);
}
function raw(n, i, wi) {
  if (n.kind === "leaf") return leafVal(n.leaf, i, wi);
  if (n.kind === "holding") { const l = n.parent.leaf; return l.value ? n.h.value * (l.series[i] / l.value) * (wi ? (F[l.key] ?? 1) * (F[n.id] ?? 1) : 1) : 0; }

}
const val = (n, i, wi) => raw(n, i, wi) * n.sign;
function isEst(n, i) {
  if (n.kind === "leaf") return !!n.leaf.est[i];
  if (n.kind === "holding") return i !== last();
  return n.kids.some(k => isEst(k, i));
}
function back(i, days) {
  const target = T[i] - days * 864e5; let j = null;
  for (let k = 0; k <= i; k++) { if (T[k] <= target) j = k; else break; }
  if (j === null && T[0] <= target + 14 * 864e5 && i > 0) j = 0;
  return j;
}
function keysUnder(n) { if (n.kind === "leaf" || n.kind === "holding") return [n.id]; return n.kids.flatMap(keysUnder); }
const under = (n, id) => { for (let p = n; p; p = p.parent) if (p.id === id) return true; return false; };

// What prices did, apart from money going in or out. Each holding has a price and a number of units for every day
// since it was first recorded. A day's gain is yesterday's units times the change in price, so buying more never counts
// as a gain. Percentages are chained day by day, which keeps a top-up from watering them down.
function priced(n, out = []) { if (n.kind === "holding") { if (n.h.p) out.push(n.h); } else if (n.kind === "leaf") n.leaf.holdings.forEach(h => { if (h.p) out.push(h); }); else n.kids.forEach(k => priced(k, out)); return out; }
function gain(n, a, b) {
  const hs = priced(n).filter(h => h.code !== "NZD"); let d = 0, r = 1, from = null;
  for (let t = Math.max(1, a + 1); t <= b; t++) {
    let num = 0, den = 0;
    for (const h of hs) { const p0 = h.p[t - 1], p1 = h.p[t], q = h.q[t - 1]; if (p0 === null || p1 === null || !q) continue; num += q * (p1 - p0); den += q * p0; }
    if (den > 0) { if (from === null) from = t - 1; d += num; r *= 1 + num / den; }
  }
  return from === null ? null : { d: d * (n.sign < 0 ? -1 : 1), r: r - 1, from };
}
const gainFrom = i => range ? (back(i, range) ?? 0) : 0;      // follows the 3 months / 1 year / all choice
const pctText = r => (Math.abs(r) < .0005 ? "" : r > 0 ? "+" : "−") + Math.abs(r * 100).toFixed(1) + "%";
function lensText(n, i, wi, big) {

    out.push(`from prices alone: ${g.r >= 0 ? "up" : "down"} ${Math.abs(g.r * 100).toFixed(1)}%, ${fmt(Math.abs(g.d))}, since ${D(X.dates[g.from])}`);

    const some = n.kind !== "holding" && (function walk(m) { return m.kind === "leaf" ? (["shares", "crypto", "kiwisaver"].includes(m.leaf.cls) && !priced(m).length) : m.kind !== "holding" && m.kids.some(walk); })(n);

    if (l.payoff) out.push(`paid off around ${monthYear(l.payoff)} at this rate`);
    out.push(l.source === "manual" ? `added by you${l.institution ? ", from " + esc(l.institution) : ""}` : `from ${esc(l.institution || "your bank")}`);

  if (n.kind === "root" && S.last_sync) out.push(`updated ${ago(S.last_sync)}`);

}
